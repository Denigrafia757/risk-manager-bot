name = "risk-manager-telegram"
main = "index.js"
compatibility_date = "2026-09-23"

# Если KV уже создан в Cloudflare, укажи его реальный ID.
# Если в Dashboard binding RISK_KV уже настроен, этот файл можно
# использовать только для структуры проекта.
[[kv_namespaces]]
binding = "RISK_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
